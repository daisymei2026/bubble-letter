<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Letters Colour Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&family=Varela+Round&family=Scoutie+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6EC;
    --plum:#3B2A3D;
    --coral:#FF6F5E;
    --mint:#7FD6C2;
    --sun:#FFC857;
    --sky:#6FB1E8;
    --grape:#B07CD6;
    --card:#FFFFFF;
    --line:#EEE1D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--plum);
    font-family:'Nunito',sans-serif;
    padding:32px 16px 64px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{text-align:center;margin-bottom:24px;}
  header h1{
    font-family:'Scoutie Sans',sans-serif;
    font-size:clamp(20px,5vw,28px);
    margin:0 0 6px;
    color:#757575;
    letter-spacing:0.5px;
  }
  .site-logo{
    max-width:220px;
    width:60%;
    height:auto;
    margin:0 0 6px;
  }
  header p{margin:0;font-size:15px;opacity:0.75;font-family:'Varela Round',sans-serif;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 6px 0 var(--line);
  }
  .card h2{
    font-family:'Varela Round',sans-serif;
    font-size:20px;
    margin:0 0 14px;
    color:var(--plum);
  }

  input[type="text"]{
    width:100%;
    padding:12px 14px;
    border:2px solid var(--line);
    border-radius:14px;
    font-family:'Nunito',sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:1px;
    text-align:right;
    color:var(--plum);
    background:var(--cream);
  }
  input[type="text"]:focus{outline:none;border-color:var(--coral);}

  #letterColours{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
  }
  .letter-swatch{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px 10px 6px 6px;
    max-width:100%;
    box-sizing:border-box;
  }
  .letter-swatch .glyph{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    width:26px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    background:var(--plum);
    color:#fff;
    font-size:14px;
  }
  .swatch-options{display:flex;flex-wrap:wrap;gap:5px;row-gap:8px;min-width:0;flex:1 1 auto;}
  .swatch-btn{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .swatch-btn.active{
    border-color:var(--plum);
    box-shadow:0 0 0 2px #fff inset;
  }
  .glitter-swatch{
    background-size:cover;
    background-position:center;
  }

  #preview{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px;
    padding:28px 10px;
    min-height:110px;
    align-items:center;
  }
  .bubble-letter{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(34px,9vw,56px);
    line-height:1;
    -webkit-text-stroke:2.5px rgba(59,42,61,0.55);
    paint-order:stroke fill;
    position:relative;
    filter:drop-shadow(0 4px 0 rgba(59,42,61,0.35));
  }
  .glyph-svg{
    display:inline-block;
    vertical-align:middle;
    filter:drop-shadow(2px 5px 3px rgba(0,0,0,0.25));
  }
  .empty-hint{
    font-family:'Varela Round',sans-serif;
    font-size:14px;
    color:var(--plum);
    opacity:0.5;
    font-weight:600;
  }

  table{width:100%;border-collapse:collapse;margin-top:4px;}
  th,td{text-align:right;padding:8px 6px;font-size:14px;border-bottom:1px solid var(--line);}
  th{font-weight:700;opacity:0.6;font-size:12px;text-transform:none;letter-spacing:0.5px;font-family:'Varela Round',sans-serif;}
  td .swatch-dot{
    display:inline-block;width:14px;height:14px;border-radius:50%;
    margin-left:8px;vertical-align:middle;border:1px solid rgba(0,0,0,0.15);
  }

  .copy-row{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:10px;
    margin-top:14px;
  }
  .copy-btn{
    background:var(--plum);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:10px 18px;
    font-family:'Varela Round',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .copy-btn:active{transform:translateY(1px);}
  .copy-msg{font-size:13px;opacity:0.7;font-family:'Varela Round',sans-serif;}

  .palette{display:grid;grid-template-columns:repeat(auto-fill, 64px);justify-content:space-between;row-gap:14px;}
  .palette-item{
    display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;
    font-weight:700;color:var(--plum);opacity:0.85;font-family:'Varela Round',sans-serif;
    text-align:center;width:64px;
  }
  .palette-swatch{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
</style>
</head>

function nearestColourName(hex){
  const h = hex.toLowerCase();
  if (h === DEFAULT_GREY.toLowerCase()) return "טרם נבחר";
  const exact = PALETTE.find(c => c.hex.toLowerCase() === h);
  if (exact) return exact.name;
  // distance match
  const r1=parseInt(h.substr(1,2),16), g1=parseInt(h.substr(3,2),16), b1=parseInt(h.substr(5,2),16);
  let best=null, bestDist=Infinity;
  PALETTE.forEach(c=>{
    const r2=parseInt(c.hex.substr(1,2),16), g2=parseInt(c.hex.substr(3,2),16), b2=parseInt(c.hex.substr(5,2),16);
    const d=(r1-r2)**2+(g1-g2)**2+(b1-b2)**2;
    if(d<bestDist){bestDist=d;best=c.name;}
  });
  return best + " (מותאם אישית)";
}

function shade(hex, percent){
  const num = parseInt(hex.replace('#',''),16);
  let r = (num>>16) + Math.round(255*percent/100);
  let g = ((num>>8)&0x00FF) + Math.round(255*percent/100);
  let b = (num&0x0000FF) + Math.round(255*percent/100);
  r = Math.max(0,Math.min(255,r));
  g = Math.max(0,Math.min(255,g));
  b = Math.max(0,Math.min(255,b));
  return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

function buildLetterSVG(letterData, colour, uid){
  const matchedColour = PALETTE.find(c => c.hex.toLowerCase() === colour.toLowerCase());
  const isGlitter = !!(matchedColour && matchedColour.glitter && matchedColour.image);

  const vb = letterData.viewBox.split(' ').map(Number); // [minX, minY, width, height]

  let fillValue = colour;
  let imageDefs = '';
  if (isGlitter) {
    imageDefs = `
      <pattern id="img-${uid}" patternUnits="userSpaceOnUse" x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}">
        <image href="${matchedColour.image}" x="0" y="0" width="${vb[2]}" height="${vb[3]}" preserveAspectRatio="xMidYMid slice"/>
      </pattern>
    `;
    fillValue = `url(#img-${uid})`;
  }

  // the reference photo already has its own gloss/shine baked in, so skip the
  // synthetic highlight blobs for the glitter colour and only use them otherwise
  const blobs = isGlitter ? '' : (letterData.highlights || []).map((h) => `
    <ellipse cx="${h.cx}" cy="${h.cy}" rx="${h.rx}" ry="${h.ry}"
      transform="rotate(${h.rotate} ${h.cx} ${h.cy})"
      fill="white" opacity="0.8" filter="url(#soften-${uid})" clip-path="url(#clip-${uid})"/>
  `).join('');

  return `
    <svg class="glyph-svg" viewBox="${letterData.viewBox}" height="64">
      <defs>
        <clipPath id="clip-${uid}">
          <path d="${letterData.d}"/>
        </clipPath>
        <filter id="soften-${uid}" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="1.6"/>
        </filter>
        ${imageDefs}
      </defs>
      <path d="${letterData.d}" fill="${fillValue}" fill-rule="${letterData.fillRule || 'nonzero'}"/>
      ${blobs}
    </svg>
  `;
}

const nameInput = document.getElementById('nameInput');
const lettersWrap = document.getElementById('letterColours');
const preview = document.getElementById('preview');
const summaryBody = document.querySelector('#summaryTable tbody');

let letterState = {}; // key: index, value: hex

function cyclicColour(i){
  return DEFAULT_GREY;
}

function render(){
  const raw = nameInput.value;
  const letters = raw.split('');

  lettersWrap.innerHTML = '';
  preview.innerHTML = '';
  summaryBody.innerHTML = '';

  if(letters.length === 0){
    preview.innerHTML = '<span class="empty-hint">הקלידו שם למעלה כדי לראות איך הוא יראה</span>';
    return;
  }

  letters.forEach((ch, i) => {
    if(ch === ' '){
      const spacer = document.createElement('span');
      spacer.style.width = '18px';
      preview.appendChild(spacer);
      return;
    }
    if(!(i in letterState)) letterState[i] = cyclicColour(i);
    const colour = letterState[i];

    // control row
    const row = document.createElement('div');
    row.className = 'letter-swatch';
    const optionsHtml = PALETTE.map(c => `
      <button type="button" class="swatch-btn${c.glitter ? ' glitter-swatch' : ''}${c.hex.toLowerCase()===colour.toLowerCase() ? ' active' : ''}"
        style="background-color:${c.hex};${c.image ? `background-image:url('${c.image}');` : ''}" data-index="${i}" data-hex="${c.hex}" title="${c.name}"></button>
    `).join('');
    row.innerHTML = `
      <span class="glyph">${ch}</span>
      <div class="swatch-options">${optionsHtml}</div>
    `;
    lettersWrap.appendChild(row);

    // preview letter
    const shapeKey = LETTER_PATHS[ch] ? ch : (LETTER_PATHS[ch.toLowerCase()] ? ch.toLowerCase() : null);
    if (shapeKey) {
      const holder = document.createElement('span');
      holder.innerHTML = buildLetterSVG(LETTER_PATHS[shapeKey], colour, `${i}-${shapeKey}`);
      preview.appendChild(holder.firstElementChild);
    } else {
      const span = document.createElement('span');
      span.className = 'bubble-letter';
      span.style.color = colour;
      span.textContent = ch;
      preview.appendChild(span);
    }

    // summary row
    const tr = document.createElement('tr');
    const matchedColour = PALETTE.find(c => c.hex.toLowerCase() === colour.toLowerCase());
    const dotIsGlitter = matchedColour && matchedColour.glitter;
    tr.innerHTML = `<td>${ch}</td><td><span class="swatch-dot${dotIsGlitter ? ' glitter-swatch' : ''}" style="background-color:${colour};${dotIsGlitter && matchedColour.image ? `background-image:url('${matchedColour.image}');` : ''}"></span>${nearestColourName(colour)}</td>`;
    summaryBody.appendChild(tr);
  });

  lettersWrap.querySelectorAll('.swatch-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const idx = e.target.dataset.index;
      letterState[idx] = e.target.dataset.hex;
      render();
    });
  });
}

nameInput.addEventListener('input', () => {
  const cleaned = nameInput.value.toUpperCase().replace(/[^A-Z]/g, '');
  if (cleaned !== nameInput.value) {
    nameInput.value = cleaned;
  }
  letterState = {}; // reset colours when the name changes length/content
  render();
});

// palette display
const paletteWrap = document.getElementById('palette');
PALETTE.forEach(c=>{
  const item = document.createElement('div');
  item.className = 'palette-item';
  item.innerHTML = `<div class="palette-swatch${c.glitter ? ' glitter-swatch' : ''}" style="background-color:${c.hex};${c.image ? `background-image:url('${c.image}');` : ''}"></div>${c.name}`;
  paletteWrap.appendChild(item);
});

// copy summary
document.getElementById('copyBtn').addEventListener('click', () => {
  const rows = Array.from(summaryBody.querySelectorAll('tr')).map(tr=>{
    const cells = tr.querySelectorAll('td');
    return `${cells[0].textContent}: ${cells[1].textContent.trim()}`;
  });
  const text = `${nameInput.value.toUpperCase()}\n` + rows.join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    const msg = document.getElementById('copyMsg');
    msg.textContent = 'Copied!';
    setTimeout(()=> msg.textContent = '', 1800);
  });
});

render();
</script>
</body>
</html>
